<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 2400" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Paper texture background">
  <defs>
    <filter id="grain" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9 0.8" numOctaves="2" seed="8" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 0.08"/>
      </feComponentTransfer>
      <feBlend mode="multiply" in="SourceGraphic"/>
    </filter>
    <linearGradient id="paper" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#f5f2ed"/>
      <stop offset="100%" stop-color="#efeee9"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="2400" fill="url(#paper)"/>

  <g opacity="0.35" filter="url(#grain)">
    <rect width="1600" height="2400" fill="#f8f6f4"/>
  </g>

  <g opacity="0.4" stroke="#d8d2cb" stroke-width="1.1" fill="none">
    <path d="M-80 150 C200 20, 450 260, 760 120 S1240 40, 1680 250"/>
    <path d="M-40 430 C270 230, 500 520, 760 370 S1220 260, 1660 520"/>
    <path d="M-100 710 C220 540, 510 850, 860 620 S1290 540, 1700 800"/>
    <path d="M-130 980 C250 760, 520 1180, 850 910 S1280 810, 1710 1080"/>
    <path d="M-160 1260 C290 1010, 540 1480, 900 1170 S1310 1110, 1700 1380"/>
    <path d="M-180 1560 C360 1330, 590 1790, 930 1510 S1320 1390, 1720 1690"/>
    <path d="M-220 1860 C340 1640, 550 2140, 910 1880 S1290 1720, 1740 2000"/>
    <path d="M-260 2140 C360 1940, 550 2360, 930 2200 S1380 2060, 1700 2310"/>
  </g>

  <g opacity="0.12" stroke="#c8c1ba" stroke-width="1.2" fill="none">
    <path d="M0 0 L1600 2400"/>
    <path d="M200 0 L1600 2100"/>
    <path d="M400 0 L1600 1800"/>
    <path d="M800 0 L1600 1400"/>
    <path d="M1200 0 L1600 1000"/>
    <path d="M0 900 L1200 2400"/>
    <path d="M0 1200 L1400 2400"/>
    <path d="M0 1700 L1000 2400"/>
  </g>
</svg>
